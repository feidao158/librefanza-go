openapi: 3.0.3
info:
  title: LibreFanza API
  version: 1.0.0
  description: |
    影片、演员、采集任务和管理接口。JSON 成功响应使用 data 字段，列表额外包含 meta。
    错误响应格式为 {"error":{"code":"错误代码"}}，空响应使用 204。
    客户端使用 Bearer 令牌认证；令牌连续 30 天无有效活动后过期，活动请求自动续期。
servers:
  - url: /api/v1
tags:
  - name: 安装
  - name: 认证
  - name: 影片与演员
  - name: 管理
  - name: 推荐与人工标注
paths:
  /openapi.yaml:
    get:
      tags: [安装]
      summary: 获取 OpenAPI 文档
      responses:
        '200': { description: OpenAPI YAML }
  /setup:
    get:
      tags: [安装]
      summary: 获取安装状态
      responses:
        '200':
          description: 返回 data.installed 和 data.managed_database_available，不包含数据库连接凭据
  /setup/database-checks:
    post:
      tags: [安装]
      summary: 测试未安装数据库连接
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Database' }
      responses:
        '200': { description: 连接成功 }
        '409': { description: 已安装 }
  /setup/redis-checks:
    post:
      tags: [安装]
      summary: 测试可选 Redis 连接
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Redis' }
      responses:
        '200': { description: 连接成功 }
  /setup/installations:
    post:
      tags: [安装]
      summary: 初始化数据库和管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                database: { $ref: '#/components/schemas/Database' }
                managed_database: { type: boolean, description: 使用服务端配置的内置数据库，默认为 false }
                redis: { $ref: '#/components/schemas/Redis' }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201': { description: 安装完成 }
        '409': { description: 已安装或与恢复中的配置不一致 }
  /users:
    post:
      tags: [认证]
      summary: 注册用户
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
  /auth/sessions:
    post:
      tags: [认证]
      summary: 登录并获取访问令牌
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/Tokens' }
        '401': { description: 认证失败 }
  /auth/me:
    get:
      tags: [认证]
      summary: 获取当前用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: X-Session-Activity, in: header, required: false, schema: { type: string, enum: [passive] }, description: 被动轮询时传 passive，可校验令牌但不延长空闲有效期 }
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { description: 未登录 }
  /auth/sessions/current:
    delete:
      tags: [认证]
      summary: 注销当前会话
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 注销成功 }
  /auth/password-reset-requests:
    post:
      tags: [认证]
      summary: 申请密码重置邮件
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 请求已受理 }
        '503': { description: 邮件功能未配置 }
  /auth/password-resets:
    post:
      tags: [认证]
      summary: 使用一次性令牌重置密码
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: 密码已更新 }
  /product-ids/normalize:
    get:
      tags: [影片与演员]
      summary: 检查并规范化影片番号
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 返回 data.valid 和 data.normalized }
  /annotations/next:
    get:
      tags: [推荐与人工标注]
      summary: 随机获取待人工标注番号
      parameters:
        - name: exclude
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 返回待标注影片与当前统计
  /annotations/feedback:
    post:
      tags: [推荐与人工标注]
      summary: 提交人工标注选项
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [normalized_id, action]
              properties:
                normalized_id: { type: string }
                action: { type: string, enum: [like, dislike, uncertain] }
                prefetched: { type: boolean, description: 使用预取候选，省略同步下一部查询 }
                candidate_ids: { type: array, maxItems: 10, items: { type: string }, description: 需要核验的预取候选番号 }
      responses:
        '200':
          description: 标注保存成功，返回更新统计、下一部影片及 eligible_ids 有效候选番号
  /annotations/candidates:
    get:
      tags: [推荐与人工标注]
      summary: 批量获取未标注影片供后台预加载
      parameters:
        - { name: exclude, in: query, schema: { type: string } }
      responses:
        '200': { description: 返回最多五部影片与标注统计 }
  /annotations/candidates/check:
    post:
      tags: [推荐与人工标注]
      summary: 校验预取影片是否仍可用于标注
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 10, items: { type: string } }
      responses:
        '200': { description: 按原顺序返回可见且未标注的番号 }
  /annotations/stats:
    get:
      tags: [推荐与人工标注]
      summary: 获取当前用户标注统计与推荐就绪状态
      responses:
        '200':
          description: 返回统计信息
  /admin/dashboard:
    get:
      tags: [管理]
      summary: 获取管理员数据与任务队列汇总
      responses:
        '200':
          description: 返回可见作品数、来源记录数、近 24 小时错误数和活动任务队列状态
        '401':
          description: 未登录
        '403':
          description: 非管理员
  /annotations/likes:
    get:
      tags: [推荐与人工标注]
      summary: 分页获取当前用户喜欢的可见作品
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 按最近标注时间倒序返回作品与总数
  /recommendations:
    get:
      tags: [推荐与人工标注]
      summary: 猜你喜欢：获取个性化推荐影片列表
      description: 仅返回 Gorse 当前候选并保持其顺序，total 为已读取候选中的可见未标注作品数量。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 返回猜你喜欢推荐影片列表与状态
        '503':
          description: 推荐服务未启用、未完成同步或暂时不可用
  /recommendations/feedback:
    post:
      tags: [推荐与人工标注]
      summary: 在猜你喜欢页面提交交互反馈
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [normalized_id, action]
              properties:
                normalized_id: { type: string }
                action: { type: string, enum: [like, dislike, uncertain] }
                prefetched: { type: boolean, description: 使用预取候选，省略同步下一部查询 }
                candidate_ids: { type: array, maxItems: 10, items: { type: string }, description: 需要核验的预取候选番号 }
      responses:
        '200':
          description: 反馈保存成功，返回更新统计及 eligible_ids 有效候选番号
  /movies:
    get:
      tags: [影片与演员]
      summary: 分页查询影片
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: match, in: query, schema: { type: string, enum: [fuzzy, prefix] } }
        - { name: order, in: query, schema: { type: string, enum: [title, release_date, date_added] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 影片列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Movie' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
  /movies/{id}:
    get:
      tags: [影片与演员]
      summary: 查询影片详情和来源版本
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: 影片详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Movie' }
        '404': { description: 未找到或已隐藏 }
  /movies/{id}/metadata-job:
    get:
      tags: [影片与演员]
      summary: 查看影片多来源补采进度
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: 任务状态、已完成来源数量及延期来源数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MetadataJob' }
        '404': { description: 没有补采任务 }
  /source-items/{id}:
    get:
      tags: [影片与演员]
      summary: 查询影片的指定来源版本
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: 来源版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SourceItem' }
        '404': { description: 未找到或关联影片已隐藏 }
  /source-items/{id}/images/{variant}:
    get:
      tags: [影片与演员]
      summary: 获取 SOD 来源的封面或缩略图
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: variant, in: path, required: true, schema: { type: string, enum: [cover, thumbnail] } }
      responses:
        '200': { description: 图片内容 }
        '404': { description: 未找到或关联影片已隐藏 }
        '502': { description: 来源图片不可用 }
  /source-items/{id}/images/samples/{index}:
    get:
      tags: [影片与演员]
      summary: 代理受支持来源的预览图片
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 图片内容 }
        '404': { description: 来源或图片不存在 }
        '502': { description: 来源图片不可用 }
  /actress-filmographies:
    get:
      tags: [影片与演员]
      summary: 根据演员姓名查询作品，允许演员资料尚未收录
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: solo, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 演员资料及影片列表；未收录资料时演员 ID 为 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      actress: { $ref: '#/components/schemas/Actress' }
                      movies: { type: array, items: { $ref: '#/components/schemas/Movie' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '404': { description: 演员已隐藏 }
  /actresses:
    get:
      tags: [影片与演员]
      summary: 分页查询演员
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [new, name] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 演员列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Actress' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
  /actresses/{id}:
    get:
      tags: [影片与演员]
      summary: 查询演员详情
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: 演员详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Actress' }
        '404': { description: 未找到或已隐藏 }
  /actresses/{id}/movies:
    get:
      tags: [影片与演员]
      summary: 查询演员作品
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: solo, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 影片列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Movie' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
  /search-jobs:
    post:
      tags: [影片与演员]
      summary: 提交番号检索，强制检索需要管理员令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                force: { type: boolean, default: false }
      responses:
        '202':
          description: 返回任务编号，普通检索在一天内复用冷却结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/JobID' }
        '400': { description: 番号无效 }
        '401': { description: 强制检索未提供管理员令牌 }
        '403': { description: 强制检索需要管理员权限 }
  /search-jobs/{id}:
    get:
      tags: [影片与演员]
      summary: 查询检索任务状态
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: 检索任务状态与完成结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SearchJob' }
        '404': { description: 任务不存在 }
  /admin/settings/sources:
    get:
      tags: [管理]
      summary: 读取脱敏来源配置
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 脱敏来源配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SourceSettingsView' }
    put:
      tags: [管理]
      summary: 更新来源配置，空密钥保留原值
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSettingsInput' }
      responses: { '200': { description: 更新成功 } }
  /admin/settings/redis:
    get:
      tags: [管理]
      summary: 读取脱敏 Redis 配置
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Redis 配置 } }
    put:
      tags: [管理]
      summary: 启用、停用或更新 Redis
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Redis' }
      responses: { '200': { description: 更新成功 } }
  /admin/settings/redis-checks:
    post:
      tags: [管理]
      summary: 测试 Redis 连接
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Redis' }
      responses: { '200': { description: 连接成功 } }
  /admin/settings/schedules:
    get:
      tags: [管理]
      summary: 获取定时任务配置
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 时区与 Cron 配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduleSettings' }
    put:
      tags: [管理]
      summary: 更新定时任务配置
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleSettings' }
      responses: { '200': { description: 更新成功 } }
  /admin/settings/smtp:
    get:
      tags: [管理]
      summary: 获取脱敏 SMTP 配置
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: SMTP 配置 } }
    put:
      tags: [管理]
      summary: 更新 SMTP 配置
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 更新成功 } }
  /admin/settings/gorse:
    get:
      tags: [管理]
      summary: 获取 Gorse 推荐系统配置
      description: 内置模式额外返回 managed、connected 和 sync，sync 包含首次对账状态、阶段与游标。
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Gorse 配置 } }
    put:
      tags: [管理]
      summary: 更新 Gorse 推荐系统配置
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 更新成功 } }
  /admin/settings/gorse-checks:
    post:
      tags: [管理]
      summary: 测试 Gorse 推荐系统连接
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 连接测试成功 } }
  /admin/source-items:
    get:
      tags: [管理]
      summary: 分页查询来源条目
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 来源条目列表 } }
  /admin/source-items/{id}:
    patch:
      tags: [管理]
      summary: 修改 Fanza 来源优先级
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 更新成功 } }
  /admin/source-items/{id}/raw:
    get:
      tags: [管理]
      summary: 获取脱敏 Fanza 原始 JSON
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: 原始 JSON } }
  /admin/source-items/{id}/rederivations:
    post:
      tags: [管理]
      summary: 重新解析来源条目
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: 解析成功 } }
  /admin/source-pages:
    get:
      tags: [管理]
      summary: 查询来源页面
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 页面列表 } }
    post:
      tags: [管理]
      summary: 导入来源页面
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '201': { description: 导入成功 } }
  /admin/source-pages/{id}:
    get:
      tags: [管理]
      summary: 安全读取原始页面内容
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: JSON 格式原始内容 } }
  /admin/movies/{id}:
    patch:
      tags: [管理]
      summary: 修改影片封面或隐藏状态
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 更新成功 } }
  /admin/actresses/{id}:
    patch:
      tags: [管理]
      summary: 修改演员隐藏状态
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/Settings' }
      responses: { '200': { description: 更新成功 } }
  /admin/maintenance-jobs:
    post:
      tags: [管理]
      summary: 手动执行采集或重建影片数据
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [actress_crawl, fanza_crawl, mgstage_crawl, rebuild_movies] }
      responses: { '202': { description: 返回任务编号 } }
  /movies/{id}/torrent-sessions:
    post:
      tags: [影片]
      summary: 搜索匹配番号并建立磁力播放会话
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '201': { description: 返回播放会话令牌、流地址和来源信息 }
        '404': { description: 影片不存在 }
        '429': { description: 会话数量达到限制 }
        '502': { description: 没有可用的磁力视频 }
  /torrent-sessions/{token}:
    delete:
      tags: [影片]
      summary: 关闭磁力播放会话并清理缓存
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: 会话已关闭 } }
  /torrent-sessions/{token}/stream:
    get:
      tags: [影片]
      summary: 读取磁力视频，支持范围请求
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses: { '200': { description: 视频内容 }, '206': { description: 视频范围内容 }, '404': { description: 会话不存在或已过期 } }
    head:
      tags: [影片]
      summary: 查询磁力视频长度与范围支持
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 视频头信息 }, '404': { description: 会话不存在或已过期 } }
  /movies/{id}/playbacks:
    get:
      tags: [影片]
      summary: 按番号查找可用的站内播放来源
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: 可用播放来源及短期有效地址 }
        '404': { description: 影片不存在或已隐藏 }
        '502': { description: 来源不可访问；playback_verification_required 表示来源要求人工验证 }
  /playback/relay/{token}:
    get:
      tags: [影片]
      summary: 转发经签名授权的媒体播放资源
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: 媒体资源或播放列表 }
        '206': { description: 媒体字节范围 }
        '403': { description: 令牌失效 }
        '502': { description: 媒体资源不可访问 }
  /admin/schedule-previews:
    get:
      tags: [管理]
      summary: 获取已保存计划的下次执行时间
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 按来源返回下次执行时间 } }
  /admin/crawl-jobs:
    post:
      tags: [管理]
      summary: 手动创建来源采集任务
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, mode]
              properties:
                source: { type: string, enum: [jable, libredmm, javdb, javbooks, javquery] }
                mode: { type: string, enum: [incremental, full, pages, dates, ids] }
                start_page: { type: integer, minimum: 1 }
                end_page: { type: integer, minimum: 1 }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                prefix: { type: string }
                start_number: { type: integer, minimum: 0 }
                end_number: { type: integer, minimum: 0 }
                number_width: { type: integer, minimum: 0, maximum: 10 }
      responses:
        '202': { description: 返回任务编号 }
        '400': { description: 参数错误 }
        '409': { description: 同一来源已有不同的采集任务 }
  /admin/logs:
    get:
      tags: [管理]
      summary: 查看运行日志
      description: 仅管理员可访问，默认保留最近 30 天的任务运行日志。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: level, in: query, schema: { type: string, enum: [info, warn, error] } }
        - { name: source, in: query, schema: { type: string, enum: [fanza, sod, mgstage, fc2, jable, avmoo, javlibrary, libredmm, javdb, javbus, javbooks, javquery] } }
        - { name: task_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 按记录编号倒序排列的日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApplicationLog' } }
                  meta: { $ref: '#/components/schemas/Pagination' }
        '401': { description: 未登录 }
        '403': { description: 无管理员权限 }
        '503': { description: 数据库不可用 }
  /admin/jobs:
    get:
      tags: [管理]
      summary: 查看任务状态
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [collection, metadata] } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 任务列表，来源采集任务包含采集进度
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        status: { type: string }
                        progress: { $ref: '#/components/schemas/CrawlProgress' }
                  meta: { $ref: '#/components/schemas/Pagination' }
  /admin/jobs/{id}/retries:
    post:
      tags: [管理]
      summary: 重试失败任务
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '202': { description: 已重新排队 } }
  /admin/metadata-backfill:
    get:
      tags: [管理]
      summary: 查看历史元数据补采进度和失败任务数
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 历史补采进度
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      progress: { $ref: '#/components/schemas/MetadataBackfill' }
                      failed_jobs: { type: integer }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Tokens:
      description: 访问令牌及用户信息
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Tokens' }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 100 } }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, format: password }
    Settings:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    MetadataJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        completed_sources: { type: integer }
        failed_sources: { type: integer }
        deferred_sources: { type: integer, description: 暂时不可用并等待恢复的来源数 }
        total_sources: { type: integer }
        collection_status: { type: string, enum: [collecting, deferred, complete, failed], description: 采集整体进度，与任务执行状态分开 }
    CrawlProgress:
      type: object
      properties:
        job_id: { type: string }
        source: { type: string }
        mode: { type: string }
        next_page: { type: integer }
        next_number: { type: integer }
        processed: { type: integer }
        undated: { type: integer }
        skipped: { type: integer, description: 已跳过的无效详情数 }
        updated_at: { type: string, format: date-time }
    MetadataBackfill:
      type: object
      properties:
        phase: { type: string, enum: [raw, movies] }
        cursor_id: { type: integer, format: int64 }
        movie_cursor_id: { type: integer, format: int64 }
        raw_limit_id: { type: integer, format: int64 }
        movie_limit_id: { type: integer, format: int64 }
        processed: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        completed: { type: boolean }
        updated_at: { type: string, format: date-time }
    ApplicationLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        level: { type: string, enum: [info, warn, error] }
        event: { type: string, description: 日志事件类型 }
        source: { type: string, description: 来源名称，空字符串表示无来源 }
        task_type: { type: string }
        task_id: { type: string, description: 任务编号，空字符串表示无任务 }
        attempt: { type: integer, description: 执行次数，从 1 开始 }
        reason: { type: string, description: 经安全分类的错误原因 }
        http_status: { type: integer, description: 来源 HTTP 状态码，0 表示无状态码 }
        stage: { type: string, description: 采集失败阶段 }
        position_type: { type: string, description: 采集位置类型，page 或 number }
        position: { type: integer, description: 采集页码或编号 }
    SourceSettingsView:
      type: object
      properties:
        fanza_configured: { type: boolean }
        proxy_configured: { type: boolean }
        fc2_url: { type: string }
        sod_url: { type: string }
        mgstage_url: { type: string }
        mgstage_series_url: { type: string }
        jable_url: { type: string }
        libredmm_url: { type: string }
        javdb_url: { type: string }
        javbus_url: { type: string }
        javbooks_url: { type: string }
        javquery_url: { type: string }
        jable_cookie_configured: { type: boolean }
        javdb_cookie_configured: { type: boolean }
        javbus_cookie_configured: { type: boolean }
        javbooks_cookie_configured: { type: boolean }
        javquery_cookie_configured: { type: boolean }
        health: { type: array, items: { $ref: '#/components/schemas/SourceHealth' } }
    SourceSettingsInput:
      type: object
      properties:
        fanza_api_id: { type: string, format: password }
        fanza_affiliate_id: { type: string, format: password }
        proxy_url: { type: string, format: password }
        clear_proxy: { type: boolean }
        fc2_url: { type: string }
        sod_url: { type: string }
        mgstage_url: { type: string }
        mgstage_series_url: { type: string }
        jable_url: { type: string }
        libredmm_url: { type: string }
        javdb_url: { type: string }
        javbus_url: { type: string }
        javbooks_url: { type: string }
        javquery_url: { type: string }
        jable_cookie: { type: string, format: password }
        javdb_cookie: { type: string, format: password }
        javbus_cookie: { type: string, format: password }
        javbooks_cookie: { type: string, format: password }
        javquery_cookie: { type: string, format: password }
        clear_jable_cookie: { type: boolean }
        clear_javdb_cookie: { type: boolean }
        clear_javbus_cookie: { type: boolean }
        clear_javbooks_cookie: { type: boolean }
        clear_javquery_cookie: { type: boolean }
    SourceHealth:
      type: object
      properties:
        source: { type: string }
        status: { type: string, enum: [unknown, available, degraded, cooldown] }
        verified: { type: boolean, description: 是否已验证列表、详情及数据保存 }
        failures: { type: integer }
        reason: { type: string, description: 安全分类后的失败原因 }
        http_status: { type: integer, description: HTTP 状态码，0 表示无状态码 }
        last_checked: { type: string, format: date-time, nullable: true }
        next_retry: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    Schedule:
      type: object
      properties:
        enabled: { type: boolean }
        cron: { type: string }
        auto: { type: boolean, description: 新来源验证后自动启用；管理员手动调整时设置为 false }
    ScheduleSettings:
      type: object
      properties:
        timezone: { type: string }
        actress: { $ref: '#/components/schemas/Schedule' }
        fanza: { $ref: '#/components/schemas/Schedule' }
        mgstage: { $ref: '#/components/schemas/Schedule' }
        jable: { $ref: '#/components/schemas/Schedule' }
        libredmm: { $ref: '#/components/schemas/Schedule' }
        javdb: { $ref: '#/components/schemas/Schedule' }
        javbus: { $ref: '#/components/schemas/Schedule' }
        javbooks: { $ref: '#/components/schemas/Schedule' }
        javquery: { $ref: '#/components/schemas/Schedule' }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: 访问令牌有效期，单位为秒 }
        user: { $ref: '#/components/schemas/User' }
    JobID:
      type: object
      properties:
        id: { type: string, format: uuid }
    SearchJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, retrying, waiting, paused, completed, failed, cancelled] }
        result:
          type: object
          properties:
            found: { type: boolean, description: 当前是否存在可公开查看的影片 }
            cached: { type: boolean, description: 在冷却期内跳过了来源检索 }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    Movie:
      type: object
      properties:
        id: { type: integer, format: int64 }
        normalized_id: { type: string }
        compressed_id: { type: string }
        release_date: { type: string, format: date-time, nullable: true }
        cover_image_url: { type: string }
        is_hidden: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        preferred_item: { $ref: '#/components/schemas/SourceItem' }
        versions: { type: array, items: { $ref: '#/components/schemas/SourceItem' } }
    SourceItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [fanza, sod, mgstage, javlibrary, fc2, avmoo, jable, libredmm, javdb, javbus, javbooks, javquery] }
        external_id: { type: string }
        normalized_id: { type: string }
        priority: { type: integer }
        title: { type: string }
        release_date: { type: string, format: date-time, nullable: true }
        description: { type: string }
        source_url: { type: string }
        cover_image_url: { type: string }
        thumbnail_image_url: { type: string }
        cover_image_original_url: { type: string, description: 代理封面的原始地址，用于去重 }
        metadata: { $ref: '#/components/schemas/MovieMetadata' }
    MovieMetadata:
      type: object
      properties:
        cast:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              fanza_id: { type: integer, format: int64 }
        genres: { type: array, items: { type: string } }
        labels: { type: array, items: { type: string } }
        makers: { type: array, items: { type: string } }
        directors: { type: array, items: { type: string } }
        series: { type: array, items: { type: string } }
        sample_image_urls: { type: array, items: { type: string } }
        sample_image_original_urls: { type: array, items: { type: string }, description: 与预览图片地址对应的原始地址，用于去重 }
        volume_minutes: { type: integer }
        rating: { type: number }
    Actress:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fanza_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        image_url: { type: string }
        is_hidden: { type: boolean }
    Database:
      type: object
      required: [driver, host, port, name, user]
      properties:
        driver: { type: string, enum: [postgres] }
        host: { type: string }
        port: { type: integer }
        name: { type: string }
        user: { type: string }
        password: { type: string, format: password }
        tls: { type: boolean }
    Redis:
      type: object
      properties:
        enabled: { type: boolean }
        address: { type: string }
        username: { type: string }
        password: { type: string, format: password }
        clear_password: { type: boolean, description: 清除已保存的 Redis 密码 }
        database: { type: integer, minimum: 0 }
        tls: { type: boolean }
