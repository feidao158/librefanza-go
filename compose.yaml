services:
  app:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    security_opt:
      - seccomp:./docker/chromium-seccomp.json
    ports:
      - "8080:8080"
    environment:
      LIBREFANZA_TRUSTED_PROXIES: ${LIBREFANZA_TRUSTED_PROXIES:-}
      FANZA_API_ID: ${FANZA_API_ID:-}
      FANZA_AFFILIATE_ID: ${FANZA_AFFILIATE_ID:-}
      PROXY_URL: ${PROXY_URL:-}
      FC2_BASE_URL: ${FC2_BASE_URL:-}
      MGSTAGE_SERIES_URL: ${MGSTAGE_SERIES_URL:-}
      BLACKHOLE_PATTERN: ${BLACKHOLE_PATTERN:-}
      GORSE_ENTRY_POINT: ${GORSE_ENTRY_POINT:-}
      GORSE_API_KEY: ${GORSE_API_KEY:-}
    volumes:
      - app-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_NAME:-librefanza}
      POSTGRES_USER: ${DB_USER:-librefanza}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: [redis]
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
